<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Information Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="page-card">
        <div class="page-heading">
            <p class="tag"></p>
            <h1>User Information Form</h1>
            <p>Enter your details in the form below.</p>
        </div>

        <form id="userForm">
            <div class="form-grid">
                <div class="form-group full">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" placeholder="Enter your full name" required>
                </div>

                <div class="form-group">
                    <label for="gender">Gender</label>
                    <select id="gender" required>
                        <option value="">Select gender</option>
                        <option>Female</option>
                        <option>Male</option>
                        <option>Other</option>
                        <option>Prefer not to say</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="mobile">Mobile Number</label>
                    <input type="tel" id="mobile" placeholder="Enter mobile number"
                           pattern="[0-9]{10}" maxlength="10"
                           title="Enter a 10-digit mobile number" required>
                </div>

                <div class="form-group full">
                    <label for="email">Email ID</label>
                    <input type="email" id="email" placeholder="example@email.com" required>
                </div>

                <div class="form-group">
                    <label for="city">City</label>
                    <input type="text" id="city" placeholder="Enter city" required>
                </div>

                <div class="form-group">
                    <label for="state">State</label>
                    <input type="text" id="state" placeholder="Enter state" required>
                </div>

                <div class="form-group full">
                    <label for="country">Country</label>
                    <input type="text" id="country" placeholder="Enter country" required>
                </div>
            </div>

            <p id="errorMessage" class="error-message"></p>

            <div class="button-row">
                <button type="submit" class="submit-button">Submit Details</button>
                <button type="reset" class="reset-button">Clear Form</button>
            </div>
        </form>

        <p class="note">Your details will be displayed on the next page in this browser tab.</p>
    </div>

    <script src="form.js"></script>
</body>
</html>
